server.port=8080

# Runtime database: MySQL (see docker-compose.yml for the matching server).
# Override with MYSQL_URL / MYSQL_USER / MYSQL_PASSWORD environment variables.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/insurancedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:insurance}
spring.datasource.password=${MYSQL_PASSWORD:insurance123}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

# CORS for the React frontend dev server (Vite, http://localhost:5173).
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

# Event publishing: local publisher by default (no cloud setup needed).
# To publish events to an external HTTP endpoint instead, set
# messaging.enabled=true and messaging.endpoint to the receiver URL.
messaging.enabled=false
messaging.endpoint=

# Demo security user (local demo only, NOT production credentials).
# All /api/** endpoints require HTTP Basic auth with this user.
app.security.demo-username=demo
app.security.demo-password=demo123
