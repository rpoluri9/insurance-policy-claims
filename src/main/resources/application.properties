server.port=8080
spring.datasource.url=jdbc:h2:mem:insurancedb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Event publishing: local publisher by default (no cloud setup needed).
# To publish events to an external HTTP endpoint instead, set
# messaging.enabled=true and messaging.endpoint to the receiver URL.
messaging.enabled=false
messaging.endpoint=

# Demo security user (local demo only, NOT production credentials).
# All /api/** endpoints require HTTP Basic auth with this user.
app.security.demo-username=demo
app.security.demo-password=demo123
