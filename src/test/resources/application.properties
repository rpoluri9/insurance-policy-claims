# Test profile: tests run on H2 (in-memory). The runtime database is MySQL
# (see src/main/resources/application.properties); this file overrides only
# the datasource so the test suite needs no MySQL server.
server.port=8080
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

app.cors.allowed-origins=http://localhost:5173,http://localhost:4173

messaging.enabled=false
messaging.endpoint=

app.security.demo-username=demo
app.security.demo-password=demo123
