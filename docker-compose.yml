services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: insurancedb
      MYSQL_USER: insurance
      MYSQL_PASSWORD: insurance123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "insurance", "-pinsurance123"]
      interval: 5s
      timeout: 5s
      retries: 20

  insurance-claims:
    build: .
    ports:
      - "8080:8080"
    environment:
      - MESSAGING_ENABLED=false
      - MYSQL_URL=jdbc:mysql://mysql:3306/insurancedb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      - MYSQL_USER=insurance
      - MYSQL_PASSWORD=insurance123
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
